[project]
name = "langgraph-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Haneen Mohammed", email = "haneeenmohammid@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "isort>=9.0.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "langchain-google-genai>=4.4.0",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.14",
    "langsmith>=0.14.4",
    "python-dotenv>=1.2.4",
    "schemas>=0.7.1",
    "tavily-python>=0.8.5",
]

[project.scripts]
langgraph-course = "langgraph_course:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
